spring.application.name=invoice-management

# H2 Database (default for development)
spring.datasource.url=jdbc:h2:file:./data/invoice_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Uncomment below to use MySQL instead of H2:
# spring.datasource.url=jdbc:mysql://localhost:3306/invoice_management?useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=${DB_PASSWORD:root}
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8081

# JWT
jwt.secret=${JWT_SECRET:SmartInvoiceSecretKey2026ForJWTTokenGenerationAndValidation}
jwt.expiration=86400000

# Jackson - handle lazy loading
spring.jackson.serialization.fail-on-empty-beans=false